# Local development only. No linked/hosted project is configured.
project_id = "closet"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081/auth/callback", "http://127.0.0.1:8081/auth/callback", "closet://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
# Keep the email provider enabled. Global auth.enable_signup controls public signup.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Local-only fixture testing; hosted production limits must be configured separately.
[auth.rate_limit]
email_sent = 60
sign_in_sign_ups = 60

[edge_runtime]
enabled = false

[analytics]
enabled = false
